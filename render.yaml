# Render Blueprint for the backend (render.com → New → Blueprint → this repo).
services:
  - type: web
    name: algebra-tutor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # entered in the Render dashboard, never in git
      - key: ALLOWED_ORIGINS
        sync: false        # the Vercel URL, e.g. https://algebra-tutor.vercel.app
